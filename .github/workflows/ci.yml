# Roda as verificações do projeto em todo push e pull request.
# A Vercel continua publicando sozinha; com a proteção da branch `main`
# (ver README), um PR só pode ser mesclado se este workflow passar.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes, build e QA visual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # QA visual: o site de produção recém-construído, aberto no Chrome sem janela,
      # rolado no computador e no celular (scripts/qa-visual.mjs). Falha o CI se
      # houver erro de console, rolagem lateral, alvo de toque pequeno ou se a
      # história do El Niño não andar. As capturas ficam como anexo da execução.
      - name: QA visual
        run: |
          npm start > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 > /dev/null && break; sleep 1; done
          npm run qa -- http://localhost:3000 --out qa-out

      - name: Capturas do QA visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-visual
          path: qa-out
          retention-days: 7
          if-no-files-found: ignore
